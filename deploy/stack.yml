services:
  backend:
    build:
      context: ../Server
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8030}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-before-production}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - app

  frontend:
    build:
      context: ../Client
      args:
        VITE_API: ${VITE_API:-/api}
    ports:
      - "${FRONTEND_PORT:-8030}:80"
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge
